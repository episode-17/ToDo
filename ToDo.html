<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办事项</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            max-width: 600px;
            margin: 50px auto;
            padding: 0 20px;
            /* 浅色主题默认样式 */
            background-color: #ffffff;
            color: #333333;
            transition: background-color 0.3s, color 0.3s;
        }
        /* 深色主题class，切换时加到body上 */
        body.dark {
            background-color: #000000;
            color: #a9a9a9;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        body.dark h1 {
            color: #a9a9a9;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom:30px;
        }
        #toggleThemeBtn {
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size:14px;
            background-color:#2563eb;
            color:white;
        }
        body.dark #toggleThemeBtn {
            background-color:#8010b8e5;
        }
        .input-area {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        #todoInput {
            flex: 1;
            padding: 10px 14px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background:#fff;
            color:#333;
        }
        body.dark #todoInput {
            background:#222222;
            color:#eee;
            border-color:#444;
        }
        #addBtn {
            padding: 10px 20px;
            background-color: #2563eb;
            color: rgb(255, 255, 255);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size:16px;
        }
        body.dark #addBtn {
            background-color: #8010b8e5;
        }
        #addBtn:hover {
            background-color: #1d4ed8;
        }
        body.dark #addBtn:hover {
            background-color: #640891e5;
        }
        ul {
            list-style: none;
        }
        li {
            padding:12px 14px;
            background: #f3f4f6;
            color:#333;
            border-radius:6px;
            margin-bottom: 10px;
            display:flex;
            align-items:center;
            gap:10px;
        }
        body.dark li {
            background: #222222;
            color:#dddddd;
        }
        /* 已完成文字加删除线 */
        .todo-text.done {
            text-decoration: line-through;
            opacity:0.6;
        }
    </style>
</head>
<body>
    <div class="header-row">
        <h1>待办事项清单</h1>
        <button id="toggleThemeBtn">切换深色</button>
    </div>
    <div class="input-area">
        <input type="text" id="todoInput" placeholder="输入新的待办事项...">
        <button id="addBtn">新增</button>
    </div>
    <ul id="todoList"></ul>

    <script>
        // 获取元素
        const input = document.getElementById('todoInput');
        const addBtn = document.getElementById('addBtn');
        const list = document.getElementById('todoList');
        const toggleBtn = document.getElementById('toggleThemeBtn');
        const body = document.body;

        // 待办数组
        let todoListData = [];

        // 读取本地存储的主题
        function loadTheme() {
            const savedTheme = localStorage.getItem('todo-theme');
            if(savedTheme === 'dark'){
                body.classList.add('dark');
                toggleBtn.innerText = "切换浅色";
            }else{
                body.classList.remove('dark');
                toggleBtn.innerText = "切换深色";
            }
        }
        // 切换主题函数
        function toggleTheme() {
            body.classList.toggle('dark');
            if(body.classList.contains('dark')){
                localStorage.setItem('todo-theme','dark');
                toggleBtn.innerText = "切换浅色";
            }else{
                localStorage.setItem('todo-theme','light');
                toggleBtn.innerText = "切换深色";
            }
        }

        // 从localStorage加载待办
        function loadTodos(){
            const saved = localStorage.getItem('todo-data');
            if(saved){
                todoListData = JSON.parse(saved);
            }
            renderTodos();
        }
        // 保存待办到localStorage
        function saveTodos(){
            localStorage.setItem('todo-data', JSON.stringify(todoListData));
        }
        // 渲染列表
        function renderTodos(){
            list.innerHTML = '';
            todoListData.forEach((item, index)=>{
                const li = document.createElement('li');
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = item.done;

                const span = document.createElement('span');
                span.className = 'todo-text' + (item.done ? ' done' : '');
                span.innerText = item.text;

                // 复选框切换事件
                checkbox.onchange = ()=>{
                    todoListData[index].done = checkbox.checked;
                    saveTodos();
                    renderTodos();
                }

                li.appendChild(checkbox);
                li.appendChild(span);
                list.appendChild(li);
            })
        }

        // 添加待办函数
        function addTodo() {
            const text = input.value.trim();
            if (!text) return; // 空内容不添加

            todoListData.push({
                text:text,
                done:false
            })
            saveTodos();
            renderTodos();
            // 清空输入框
            input.value = '';
        }

        // 绑定事件
        toggleBtn.addEventListener('click', toggleTheme);
        addBtn.addEventListener('click', addTodo);
        input.addEventListener('keydown', e => {
            if(e.key === 'Enter') addTodo();
        })

        // 页面加载
        loadTheme();
        loadTodos();
    </script>
</body>
</html>
